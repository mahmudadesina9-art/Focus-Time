<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Focus Time</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #101827;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgb(50 91 123 / 28%),
            transparent 55%
          ),
          linear-gradient(145deg, #101827, #131f2d 55%, #101827);
      }

      .timer-card {
        width: min(100%, 460px);
        padding: clamp(28px, 7vw, 52px);
        border: 1px solid rgb(190 213 235 / 12%);
        border-radius: 28px;
        background: linear-gradient(
          155deg,
          rgb(35 51 68 / 96%),
          rgb(25 38 52 / 96%)
        );
        box-shadow:
          0 28px 80px rgb(0 0 0 / 35%),
          inset 0 1px 0 rgb(255 255 255 / 5%);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #dce8f3;
        font-size: clamp(1.1rem, 4vw, 1.35rem);
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .timer-caption {
        margin: 8px 0 0;
        color: #91a4b7;
        font-size: 0.9rem;
      }

      #focus-time {
        margin: clamp(28px, 8vw, 44px) 0;
        color: #f8fbff;
        font-size: clamp(4rem, 19vw, 6.5rem);
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        letter-spacing: -0.075em;
        line-height: 1;
      }

      .timer-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .timer-controls button {
        flex: 1 1 105px;
        min-height: 52px;
        padding: 12px 18px;
        border: 1px solid transparent;
        border-radius: 14px;
        color: #f8fbff;
        font: inherit;
        font-size: 0.98rem;
        font-weight: 650;
        cursor: pointer;
        transition:
          filter 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      #startBtn {
        background: #36a879;
        box-shadow: 0 8px 20px rgb(54 168 121 / 20%);
      }

      #pauseBtn {
        border-color: rgb(245 190 90 / 20%);
        background: #59472d;
        color: #ffdb9a;
      }

      #resetBtn {
        border-color: rgb(255 255 255 / 10%);
        background: rgb(255 255 255 / 6%);
        color: #c5d1dd;
      }

      .timer-controls button:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
      }

      .timer-controls button:active {
        transform: translateY(0);
      }

      .timer-controls button:focus-visible {
        outline: 3px solid #a7d8ff;
        outline-offset: 3px;
      }

      @media (max-width: 420px) {
        body {
          padding: 16px;
        }

        .timer-card {
          border-radius: 22px;
        }

        .timer-controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        #startBtn {
          grid-column: 1 / -1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .timer-controls button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="timer-card">
      <h1>Focus Time</h1>
      <p class="timer-caption">Stay present. One minute at a time.</p>
      <div
        id="focus-time"
        role="timer"
        aria-live="off"
        aria-label="Elapsed focus time"
      >
        00:00
      </div>
      <div class="timer-controls">
        <button id="startBtn" onclick="startTimer()">Start</button>
        <button id="pauseBtn" onclick="pauseTimer()">Pause</button>
        <button id="resetBtn" onclick="resetTimer()">Reset</button>
      </div>
    </main>
  </body>

  <script>
    const focusTime = document.getElementById("focus-time");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let elapsedTime = Number(localStorage.getItem("elapsedTime")) || 0;
    let activeStartTime = null;
    let timerInterval = null;
    let isRunning = false;

    function updateDisplay(totalElapsedTime) {
      const minutes = Math.floor(totalElapsedTime / 60);
      const seconds = Math.floor(totalElapsedTime % 60);

      focusTime.textContent = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
    }

    function startTimer() {
      if (timerInterval !== null) {
        return;
      }
      activeStartTime = Date.now();
      isRunning = true;

      startBtn.style.display = "none";

      timerInterval = setInterval(() => {
        const activeDuration = (Date.now() - activeStartTime) / 1000;
        const totalElapsedTime = elapsedTime + activeDuration;
        updateDisplay(totalElapsedTime);
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) {
        return;
      }
      elapsedTime += (Date.now() - activeStartTime) / 1000;

      localStorage.setItem("elapsedTime", elapsedTime);

      clearInterval(timerInterval);
      timerInterval = null;
      isRunning = false;
      startBtn.textContent = "Resume";

      // startBtn.innerText = "continue";
      startBtn.style.display = "inline-block";
    }

    function resetTimer() {
      const confirmReset = confirm("Are you sure you want to reset the timer?");
      if (!confirmReset) {
        return;
      }
      clearInterval(timerInterval);
      timerInterval = null;
      activeStartTime = null;
      elapsedTime = 0;
      localStorage.removeItem("elapsedTime");
      isRunning = false;
      console.log("timer reset");
      focusTime.textContent = "00:00";

      startBtn.textContent = "Start";
      startBtn.style.display = "inline-block";
    }
    updateDisplay(elapsedTime);
  </script>
</html>
